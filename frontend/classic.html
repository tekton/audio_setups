<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio gear layout (classic)</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-mode="classic">
  <header>
    <div class="header-brand">
      <h1>Audio gear layout</h1>
      <nav>
        <a href="port-types.html" class="nav-link">Port types</a>
        <a href="device-types.html" class="nav-link">Device types</a>
        <a href="index.html" class="nav-link">Rack view</a>
        <a href="library.html" class="nav-link">Library</a>
      </nav>
    </div>
    <div class="toolbar-main">
      <div class="toolbar toolbar-row-main">
        <span class="toolbar-group">
          <label for="add-device-select" class="toolbar-label">Add device</label>
          <select id="add-device-select" class="toolbar-select" aria-label="Add device type">
            <option value="">— choose type —</option>
            <option value="dac">DAC</option>
            <option value="amp">Amp</option>
            <option value="speaker">Speaker</option>
          </select>
        </span>
        <span class="toolbar-group">
          <label class="toolbar-label toolbar-switch" title="Put every device's ports on its left/right sides instead of top/bottom">
            <input type="checkbox" id="toggle-ports-sides" role="switch" /> Ports on sides
          </label>
        </span>
        <span class="toolbar-group rack-only">
          <label for="add-rack-width" class="toolbar-label">Add rack</label>
          <select id="add-rack-width" class="toolbar-select" aria-label="Rack width in inches">
            <option value="19" selected>19"</option>
            <option value="10">10"</option>
            <option value="6">6"</option>
          </select>
          <input type="number" id="add-rack-height" class="toolbar-input" value="12" min="1" max="60" aria-label="Rack height in U" title="Height in U" />
          <span class="toolbar-label">U</span>
          <button type="button" id="btn-add-rack">Add rack</button>
        </span>
        <span class="toolbar-group">
          <button type="button" id="btn-delete">Delete selected</button>
          <button type="button" id="btn-remove-cable" disabled>Sever Connection</button>
        </span>
        <span class="toolbar-group">
          <button type="button" id="btn-toggle-save-load" class="toolbar-toggle" aria-expanded="false" aria-controls="toolbar-save-load" title="Show save and load options">Save & load</button>
        </span>
      </div>
      <div id="toolbar-save-load" class="toolbar toolbar-save-load" role="region" aria-label="Save and load layout" hidden>
        <span class="toolbar-group server-only">
          <label for="storage-mode-select" class="toolbar-label">Save/Load From</label>
          <select id="storage-mode-select" class="toolbar-select" aria-label="Storage: Server or Device">
            <option value="server">Server</option>
            <option value="local">Device</option>
          </select>
        </span>
        <span class="toolbar-group">
          <input type="text" id="layout-name" class="toolbar-input" placeholder="Layout name" value="Untitled layout" aria-label="Layout name" />
          <button type="button" id="btn-save">Save</button>
          <button type="button" id="btn-new">New layout</button>
        </span>
        <span class="toolbar-group">
          <button type="button" id="btn-export-layout" title="Download this layout as a JSON file">Export</button>
          <button type="button" id="btn-share-link" title="Copy a link that opens this layout in someone else's browser">Copy link</button>
          <button type="button" id="btn-export-image" title="Download a picture (PNG) of this layout">Export image</button>
          <button type="button" id="btn-import-layout" title="Load a layout from a JSON file">Import</button>
          <input type="file" id="import-layout-file" accept="application/json,.json" hidden />
        </span>
        <span class="toolbar-group">
          <label for="load-layout-select" class="toolbar-label">Load</label>
          <select id="load-layout-select" class="toolbar-select" aria-label="Load saved layout">
            <option value="">— Select to load —</option>
          </select>
          <button type="button" id="btn-rename-layout" disabled title="Rename the saved layout to the name in the box">Rename</button>
          <button type="button" id="btn-duplicate-layout" title="Save a copy of this layout under a new name">Duplicate</button>
          <button type="button" id="btn-delete-layout" disabled title="Delete current layout">Delete layout</button>
        </span>
      </div>
    </div>
  </header>

  <aside id="ports-editor" class="ports-editor hidden" aria-label="Ports for selected device">
    <p class="ports-editor-label">—</p>
    <label for="ports-inputs">Input ports (comma-separated)</label>
    <input type="text" id="ports-inputs" placeholder="e.g. Phono, Line In" />
    <label for="ports-outputs">Output ports (comma-separated)</label>
    <input type="text" id="ports-outputs" placeholder="e.g. Out L, Out R" />
    <button type="button" id="btn-apply-ports">Apply</button>
    <label class="toolbar-switch" title="Override the canvas setting for this device">
      <input type="checkbox" id="device-ports-sides" role="switch" /> Ports on sides
    </label>
    <label for="device-width" class="rack-only">Width</label>
    <select id="device-width" class="rack-only">
      <option value="19">19"</option>
      <option value="10">10"</option>
      <option value="6">6"</option>
    </select>
    <label for="device-height" class="rack-only">Height (U)</label>
    <input type="number" id="device-height" class="rack-only" min="1" max="60" value="1" />
  </aside>
  <main class="canvas-wrapper">
    <div id="canvas-message" class="canvas-message" role="status" aria-live="polite"></div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" />
        </marker>
      </defs>
      <g id="racks-layer"></g>
      <g id="devices-layer"></g>
      <g id="cables-layer"></g>
      <line id="rubber-band" class="rubber-band" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
    </svg>
  </main>

  <script src="js/config.js"></script>
  <script src="js/port-type-default.js"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
